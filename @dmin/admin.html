<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <link rel="icon" href="logo.jpg" type="image/x-icon">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --deep-blue: #003366;
        }
        body { background-color: #f8f9fa; padding-top: 50px; }
        .admin-card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: none; }
        .btn-primary { background-color: var(--deep-blue); border-color: var(--deep-blue); }
        .btn-primary:hover { background-color: #002244; }
        .team-preview-img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container mb-5">
    <div class="row">
        <div class="col-12 text-center mb-4">
            <h2 style="color: var(--deep-blue);">Leadership Team Admin Panel</h2>
            <p>Manage the "Meet Our Leadership" section</p>
        </div>
    </div>

    <div class="row">
        <!-- Form Section -->
        <div class="col-lg-4 mb-4">
            <div class="card admin-card p-4">
                <h4 id="form-title">Add New Member</h4>
                <form id="team-form">
                    <input type="hidden" id="member-id">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="e.g. Alex Johnson" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <input type="text" id="role" class="form-control" placeholder="e.g. CEO & Founder" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Image URL (img size height: 297 px width: 240 px)</label>
                        <input type="text" id="imageUrl" class="form-control" placeholder="Link to photo (Unsplash or direct link)">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea id="description" class="form-control" rows="4" placeholder="Brief bio..." required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">LinkedIn URL</label>
                        <input type="text" id="linkedin" class="form-control" placeholder="Optional">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Twitter URL</label>
                        <input type="text" id="twitter" class="form-control" placeholder="Optional">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" id="submit-btn" class="btn btn-primary">Save Member</button>
                        <button type="button" id="cancel-btn" class="btn btn-light d-none" onclick="resetForm()">Cancel Edit</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Data Display Section -->
        <div class="col-lg-8">
            <div class="card admin-card p-4">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Photo</th>
                                <th>Name</th>
                                <th>Role</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="team-table-body">
                            <!-- Data will be loaded here -->
                        </tbody>
                    </table>
                </div>
                <div id="loader" class="text-center">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p>Loading team...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Firebase Modular SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getFirestore, 
        collection, 
        addDoc, 
        getDocs, 
        onSnapshot, 
        deleteDoc, 
        doc, 
        updateDoc 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Your Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBYh30bupY2zhuGVhZ0cnJad4Cig6_SZ5s",
        authDomain: "zoneadminpg.firebaseapp.com",
        projectId: "zoneadminpg",
        storageBucket: "zoneadminpg.firebasestorage.app",
        messagingSenderId: "280938840150",
        appId: "1:280938840150:web:49c7cfb415f12bae46fbf7",
        measurementId: "G-TP5NMVHEZ0"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colRef = collection(db, "leadership");

    const teamForm = document.getElementById('team-form');
    const tableBody = document.getElementById('team-table-body');
    const loader = document.getElementById('loader');
    const submitBtn = document.getElementById('submit-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const formTitle = document.getElementById('form-title');

    // --- 1. Real-time Listener to Fetch Data ---
    onSnapshot(colRef, (snapshot) => {
        loader.style.display = 'none';
        tableBody.innerHTML = '';
        snapshot.docs.forEach((doc) => {
            const member = doc.data();
            const id = doc.id;
            
            const tr = `
                <tr>
                    <td><img src="${member.imageUrl || 'https://via.placeholder.com/150'}" class="team-preview-img"></td>
                    <td><strong>${member.name}</strong></td>
                    <td>${member.role}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editMember('${id}', '${member.name}', '${member.role}', '${member.imageUrl}', \`${member.description}\`, '${member.linkedin || ''}', '${member.twitter || ''}')">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteMember('${id}')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
            tableBody.innerHTML += tr;
        });
    });

    // --- 2. Create or Update Member ---
    teamForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const id = document.getElementById('member-id').value;
        const data = {
            name: document.getElementById('name').value,
            role: document.getElementById('role').value,
            imageUrl: document.getElementById('imageUrl').value,
            description: document.getElementById('description').value,
            linkedin: document.getElementById('linkedin').value,
            twitter: document.getElementById('twitter').value,
            timestamp: new Date()
        };

        try {
            if (id === "") {
                // Add new
                await addDoc(colRef, data);
                alert("Member added successfully!");
            } else {
                // Update existing
                const docRef = doc(db, "leadership", id);
                await updateDoc(docRef, data);
                alert("Member updated successfully!");
            }
            resetForm();
        } catch (error) {
            console.error("Error: ", error);
            alert("Error saving: " + error.message);
        }
    });

    // --- 3. Delete Member ---
    window.deleteMember = async (id) => {
        if (confirm("Are you sure you want to delete this team member?")) {
            try {
                await deleteDoc(doc(db, "leadership", id));
            } catch (error) {
                alert("Error deleting: " + error.message);
            }
        }
    };

    // --- 4. Prepare Edit Mode ---
    window.editMember = (id, name, role, img, desc, linkedin, twitter) => {
        document.getElementById('member-id').value = id;
        document.getElementById('name').value = name;
        document.getElementById('role').value = role;
        document.getElementById('imageUrl').value = img;
        document.getElementById('description').value = desc;
        document.getElementById('linkedin').value = linkedin;
        document.getElementById('twitter').value = twitter;

        formTitle.innerText = "Edit Member";
        submitBtn.innerText = "Update Member";
        cancelBtn.classList.remove('d-none');
        window.scrollTo(0, 0);
    };

    // --- 5. Reset Form ---
    window.resetForm = () => {
        teamForm.reset();
        document.getElementById('member-id').value = "";
        formTitle.innerText = "Add New Member";
        submitBtn.innerText = "Save Member";
        cancelBtn.classList.add('d-none');
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
